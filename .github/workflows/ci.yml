name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Compile Python
        shell: pwsh
        run: >-
          python -m py_compile
          vtrack_shot_tracker.py
          vtrack_desktop.py
          vtrack_version.py
          vtrack_updater.py
          club_config.py
          collector/vtrack_shot_collector.py
          review/shot_review.py
          tools/backfill_vtrack_clubs.py
          tools/check_ui_js.py
          tools/create_ui_smoke_archive.py
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Check embedded UI JavaScript
        shell: pwsh
        run: |
          $js = python tools/check_ui_js.py
          node --check $js
          Remove-Item $js
      - name: Run synthetic browser workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'vtrack-ui-smoke-archive'
          python tools/create_ui_smoke_archive.py --archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not create smoke-test archive.' }
          $db = Join-Path $archive 'vtrack_shots.sqlite3'
          $heartbeat = Join-Path $archive 'collector_heartbeat.json'
          $viewerOut = Join-Path $env:RUNNER_TEMP 'vtrack-viewer.out.log'
          $viewerErr = Join-Path $env:RUNNER_TEMP 'vtrack-viewer.err.log'
          $viewerArgs = @('review\shot_review.py', '--db', ('"' + $db + '"'), '--port', '8765', '--no-browser')
          $viewer = Start-Process -FilePath python -ArgumentList $viewerArgs -PassThru -RedirectStandardOutput $viewerOut -RedirectStandardError $viewerErr
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/' -TimeoutSec 1
                if ($response.StatusCode -eq 200 -and $response.Content -match '<title>vTrack Shot Tracker</title>') {
                  $ready = $true
                  break
                }
              }
              catch {}
              Start-Sleep -Milliseconds 100
            }
            if (-not $ready) {
              Get-Content $viewerOut -ErrorAction SilentlyContinue
              Get-Content $viewerErr -ErrorAction SilentlyContinue
              throw 'Shot Review did not become ready for browser smoke testing.'
            }

            $browserCandidates = @(
              (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
              (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
            )
            $browserExe = $browserCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
            if (-not $browserExe) { throw 'Chrome or Edge was not found on the Windows runner.' }

            $profile = Join-Path $env:RUNNER_TEMP 'vtrack-cdp-profile'
            $browserArgs = @(
              '--headless=new',
              '--disable-gpu',
              '--no-first-run',
              '--disable-default-apps',
              '--remote-debugging-port=9223',
              ('--user-data-dir="' + $profile + '"'),
              'http://127.0.0.1:8765/'
            )
            $browser = Start-Process -FilePath $browserExe -ArgumentList $browserArgs -PassThru
            try {
              $cdpReady = $false
              for ($i = 0; $i -lt 60; $i++) {
                try {
                  $targets = Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 1
                  if ($targets) { $cdpReady = $true; break }
                }
                catch {}
                Start-Sleep -Milliseconds 100
              }
              if (-not $cdpReady) { throw 'Browser debugging endpoint did not become ready.' }

              # The smoke archive has no real collector process, so keep its
              # synthetic heartbeat current while the browser assertions run. This
              # exercises the real four-second liveness contract without a timing race.
              $heartbeatJob = Start-Job -ArgumentList $heartbeat -ScriptBlock {
                param($path)
                while ($true) {
                  $payload = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
                  $payload.epoch = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() / 1000.0
                  $payload.updated_at = [DateTime]::Now.ToString('s')
                  $tmpPath = "$path.tmp"
                  $payload | ConvertTo-Json -Compress | Set-Content -LiteralPath $tmpPath -Encoding utf8
                  Move-Item -LiteralPath $tmpPath -Destination $path -Force
                  Start-Sleep -Milliseconds 500
                }
              }
              try {
                node tools/check_ui_smoke.mjs
                if ($LASTEXITCODE -ne 0) { throw 'Synthetic browser workflow failed.' }
              }
              finally {
                Stop-Job -Job $heartbeatJob -ErrorAction SilentlyContinue
                Remove-Job -Job $heartbeatJob -Force -ErrorAction SilentlyContinue
              }
            }
            finally {
              if ($browser -and -not $browser.HasExited) { Stop-Process -Id $browser.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          finally {
            if ($viewer -and -not $viewer.HasExited) { Stop-Process -Id $viewer.Id -Force -ErrorAction SilentlyContinue }
          }
